<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milan Dewaele</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1 id="progress" >Eens kijken...</h1>
        <div class="row">
            <a href="https://github.com/milanwdewaele" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://www.linkedin.com/in/milanwdewaele/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://www.instagram.com/milanwdewaele" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
    </main>
    <small>Gemaakt door Milan. Gehost op Vercel.</small>
</body>
<script>
const p = document.getElementById("progress"), s = 7300000, u = "https://upload.wikimedia.org/wikipedia/commons/3/3a/Bloemen_van_adderwortel_%28Persicaria_bistorta%2C_synoniem%2C_Polygonum_bistorta%29_06-06-2021._%28d.j.b%29.jpg";

addEventListener("load", () => {
  const i = new Image(), t = Date.now();
  i.onload = () => p.textContent = `${((s * 8) / ((Date.now() - t) / 1000) / 1048576).toFixed(2)} Mbps`;
  i.onerror = () => p.textContent = "Fout bij downloaden";
  i.src = `${u}?t=${t}`;
});
</script>
</html>
